# Guardrail limits for the Gemini prediction-markets MCP server and runner.
# Re-read on every propose/confirm, so edits take effect without a restart.
# Unknown keys are rejected (protects against typos). Fractions: 0.08 = 8%.

# ---- Hard dollar limits (server-enforced; the runner can never exceed them)
# Absolute ceiling per buy, in dollars (quantity x price). Kelly sizing is capped by this.
max_order_usd: 2
# Total buy dollars confirmed per UTC day (also capped by max_daily_spend_pct). Not refunded on cancel.
max_daily_spend_usd: 5
# Refuse new orders when the account already has this many open orders.
max_open_orders: 3
# Buys placed per UTC day (live or paper, per mode). Counted at confirm, never refunded.
max_trades_per_day: 5
# Sells of held quantity (exits) per UTC day. Exits don't count against max_trades_per_day, so a used-up trade
# budget never blocks reducing a position.
max_exits_per_day: 10
# Exact event tickers that may be traded. Empty = nothing can trade.
# Child events of a game must be listed by their own ticker.
allowed_event_tickers: []

# ---- Conviction sizing (buys only; sells of held quantity are not Kelly-sized)
# q_adj = estimate_weight * my_estimate + (1 - estimate_weight) * market_price
estimate_weight: 0.7
# Stake = balance * Kelly fraction * kelly_multiplier (0.25 = quarter Kelly)
kelly_multiplier: 0.25
# No trade unless q_adj - price - fee_per_contract >= min_edge
min_edge: 0.05
# Fee estimate per contract in dollars. Gemini's API docs don't state it; check your fee schedule.
fee_per_contract: 0.02
# Placeholder until you check it. Set true only after confirming fee_per_contract against Gemini's fee
# schedule; preflight.py (run at server and runner startup) fails until you do.
fee_confirmed: false
# Caps as a share of equity (cash + positions at Gemini's mark; paper equity in DRY_RUN).
max_order_pct_of_balance: 0.08
max_market_pct_of_balance: 0.15   # per event, counting existing position and resting buys
max_daily_spend_pct: 0.25          # of start-of-day equity

# ---- Circuit breakers (trip -> KILL file created; delete it by hand to resume)
max_drawdown_pct: 0.20     # from peak equity; peak restarts from current equity when you delete KILL
max_daily_loss_pct: 0.08   # from start-of-UTC-day equity
# Absolute floor: trips when equity < equity_floor_pct x starting balance. Deleting KILL never resets it;
# while equity stays below the floor, every order trips it again. 0 disables.
equity_floor_pct: 0.60
# Live only (DRY_RUN uses paper_bankroll_usd). Set this to the account balance you start trading with
# (formerly initial_deposit_usd). Preflight requires it in live mode.
# starting_balance_usd: 100

# ---- Optional per-category exposure caps (fraction of equity, per Gemini event category).
# "default" applies to any category not listed. Empty = no category caps.
# Example: {default: 0.30, sports: 0.20}
category_exposure_caps: {}

# ---- Order book quality (runner entry filter)
max_spread: 0.04           # best ask - best bid
min_depth_multiple: 1      # contracts available at or better than our price >= order size x this

# ---- Runner
exit_hours_before_expiry: 24   # near expiry, exit unless clearly winning
# Entry window (short-dated focus): only contracts expiring between min_hours_to_expiry hours and
# max_days_to_expiry days from now are researched or entered; others are logged as no_trade and skipped.
# Held positions are always reviewed. Preflight warns above 30 days. Note: an entry inside
# exit_hours_before_expiry (24 h) is sold on the next run unless it is clearly winning.
max_days_to_expiry: 7
min_hours_to_expiry: 6
clearly_winning_price: 0.85    # "clearly winning" = current sell price at or above this
paper_bankroll_usd: 100        # starting paper cash in DRY_RUN (delete paper_ledger.json to reset)
runner_auto_confirm_live: false
research_model: claude-opus-5-5
research_max_searches: 5       # web searches per contract
max_research_per_run: 10       # research calls per run (position reviews first); max 20; above 5 needs the cap below
# Research cost caps in USD, estimated from each call's token and search counts at the prices below and logged
# as "research_cost" in audit.log. Research stops (logged as research_budget_reached) when the next call,
# projected at the costliest call seen today, would pass a cap. The day cap counts DRY_RUN and live together.
max_research_cost_usd_per_run: 3
max_research_cost_usd_per_day: 10
# Anthropic list prices for claude-opus-5-5 (per million tokens) and web search ($10 per 1,000). Update them if
# you change research_model. A refusal fallback to another model may cost more than this estimate.
research_input_usd_per_mtok: 4
research_output_usd_per_mtok: 20
research_usd_per_search: 0.01
min_sources: 2                 # fewer sources than this -> no trade
